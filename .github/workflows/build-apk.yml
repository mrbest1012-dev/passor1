name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web app
        run: |
          mkdir -p www
          cp hokm-single.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 capacitor-zeroconf --legacy-peer-deps
          npx cap init PASOOR com.pasoor.game --web-dir=www
          npx cap add android
          npm i @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android --iconBackgroundColor '#7a1020' --iconBackgroundColorDark '#7a1020'
          npx cap sync android
      - name: Add network and camera permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission\|uses-feature" android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pasoor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
